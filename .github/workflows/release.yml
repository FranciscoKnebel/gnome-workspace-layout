name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, for example v0.1.0
        required: true
        type: string
      draft:
        description: Create the release as a draft
        required: true
        default: true
        type: boolean
      prerelease:
        description: Mark the release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Validate release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          expected="v$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [ "$TAG" != "$expected" ]; then
            echo "Release tag must match package.json version. Expected $expected, got $TAG." >&2
            exit 1
          fi

      - run: npm run check

      - name: Package release artifacts
        run: npm run package:release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [ "$DRAFT" = "true" ]; then flags+=(--draft); fi
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" \
            release/workspace-layout@franciscoknebel.com.zip \
            release/workspace-layout-cli-and-schema.tar.gz \
            --title "$TAG" \
            --generate-notes \
            "${flags[@]}"
